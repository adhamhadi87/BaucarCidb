name: i-Filing BKA Weekly Zimbra Reminder

on:
  workflow_dispatch:

jobs:
  send-weekly-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Check Zimbra secrets
        env:
          ZIMBRA_USERNAME: ${{ secrets.ZIMBRA_USERNAME }}
          ZIMBRA_PASSWORD: ${{ secrets.ZIMBRA_PASSWORD }}
          BOSS_EMAILS: ${{ secrets.BOSS_EMAILS }}
        run: |
          if [ -z "$ZIMBRA_USERNAME" ]; then
            echo "ERROR: ZIMBRA_USERNAME tidak diterima oleh workflow"
            exit 1
          else
            echo "OK: ZIMBRA_USERNAME diterima"
          fi

          if [ -z "$ZIMBRA_PASSWORD" ]; then
            echo "ERROR: ZIMBRA_PASSWORD tidak diterima oleh workflow"
            exit 1
          else
            echo "OK: ZIMBRA_PASSWORD diterima"
          fi

          if [ -z "$BOSS_EMAILS" ]; then
            echo "WARNING: BOSS_EMAILS kosong - ringkasan boss tidak akan dihantar"
          else
            echo "OK: BOSS_EMAILS diterima"
          fi

      - name: Run weekly Zimbra reminder
        env:
          ZIMBRA_USERNAME: ${{ secrets.ZIMBRA_USERNAME }}
          ZIMBRA_PASSWORD: ${{ secrets.ZIMBRA_PASSWORD }}

          ZIMBRA_SMTP_SERVER: "mail.cidb.gov.my"
          ZIMBRA_SMTP_PORT: "587"

          BOSS_EMAILS: ${{ secrets.BOSS_EMAILS }}
          GROUP_KEWANGAN_EMAIL: ${{ secrets.GROUP_KEWANGAN_EMAIL }}

          TEST_MODE: "false"

        run: python send_email.py

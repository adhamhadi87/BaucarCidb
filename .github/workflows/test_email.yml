name: E-Filing BKA Weekly Gmail Reminder

on:
  workflow_dispatch:

  schedule:
    # Setiap Rabu, 9:00 pagi waktu Malaysia (UTC+8)
    # GitHub Actions cron menggunakan UTC
    - cron: "0 1 * * 3"

jobs:
  send-weekly-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Check Gmail secrets
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BOSS_EMAILS: ${{ secrets.BOSS_EMAILS }}
        run: |
          if [ -z "$GMAIL_USERNAME" ]; then
            echo "ERROR: GMAIL_USERNAME tidak diterima oleh workflow"
            exit 1
          else
            echo "OK: GMAIL_USERNAME diterima"
          fi

          if [ -z "$GMAIL_APP_PASSWORD" ]; then
            echo "ERROR: GMAIL_APP_PASSWORD tidak diterima oleh workflow"
            exit 1
          else
            echo "OK: GMAIL_APP_PASSWORD diterima"
          fi

          if [ -z "$BOSS_EMAILS" ]; then
            echo "WARNING: BOSS_EMAILS kosong - ringkasan boss tidak akan dihantar"
          else
            echo "OK: BOSS_EMAILS diterima"
          fi

      - name: Run weekly Gmail reminder
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BOSS_EMAILS: ${{ secrets.BOSS_EMAILS }}

          # LIVE MODE
          TEST_MODE: "false"

        run: python send_email.py

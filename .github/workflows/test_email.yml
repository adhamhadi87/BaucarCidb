name: E-Filing BKA Weekly Reminder

on:
  workflow_dispatch:

  schedule:
    # Setiap Rabu, 9:00 pagi waktu Malaysia (UTC+8)
    # GitHub Actions cron menggunakan UTC
    - cron: "0 1 * * 3"

jobs:
  send-weekly-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run E-Filing BKA weekly reminder
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_FROM_EMAIL: ${{ secrets.BREVO_FROM_EMAIL }}
          BREVO_FROM_NAME: ${{ secrets.BREVO_FROM_NAME }}

          # LIVE MODE:
          # Email dihantar kepada EMAIL_PEMILIK
          # yang dipadankan melalui ID dalam sheet EMEL.
          TEST_MODE: "false"

        run: python send_email.py
